<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>（試玩）工地事前 風險評估暨危害告知</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --red:#d93025; --green:#007350; --ink:#202124; --sub:#5f6368; --line:#dadce0; --bg:#f0ebe4; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:19px; line-height:1.55; }
  .wrap { max-width:680px; margin:0 auto; padding:12px 12px 40px; }
  .card { background:#fff; border-radius:8px; padding:18px 18px 16px; margin-bottom:12px; border:1px solid var(--line); }
  .head { border-top:10px solid var(--green); }
  .head h1 { font-size:26px; margin:0 0 6px; line-height:1.3; }
  .head p { margin:0; color:var(--sub); }
  .head .req-note { color:var(--red); font-size:16px; margin-top:10px; }
  .q.bad { border-color:var(--red); }
  .qt { font-size:20px; font-weight:600; margin-bottom:10px; white-space:pre-wrap; }
  .qt .star { color:var(--red); margin-left:4px; }
  .qd, .tip { color:var(--sub); font-size:16px; margin:-4px 0 8px; }
  .note .qt { font-weight:700; margin:0; }
  .opt { display:flex; align-items:flex-start; gap:12px; padding:10px 0; cursor:pointer; }
  .opt input { width:26px; height:26px; margin:1px 0 0; flex:none; accent-color:var(--green); }
  .opt.none { border-top:1px dashed var(--line); margin-top:4px; padding-top:12px; }
  input[type=text], input[type=date], textarea { width:100%; font-size:19px; padding:12px; border:1px solid var(--line);
         border-radius:6px; font-family:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:80px; resize:vertical; }
  /* iPhone 日期框有最小寬度，字放大後並排會撐破卡片 → 上下排、限制寬度 */
  input[type=date] { display:block; min-width:0; max-width:100%; min-height:52px; -webkit-appearance:none; appearance:none; text-align:left; }
  .range label { display:block; color:var(--sub); font-size:16px; margin:2px 0 4px; }
  .range input + label { margin-top:10px; }
  .sugg { border:1px solid var(--line); border-radius:6px; margin-top:4px; overflow:hidden; }
  .sugg button { display:block; width:100%; text-align:left; background:#fff; border:0; border-bottom:1px solid #eee;
         border-radius:0; padding:13px 12px; font-size:19px; color:var(--ink); }
  .sugg button:last-child { border-bottom:0; }
  .sugg small { color:var(--sub); margin-left:6px; }
  .msg { color:var(--red); font-size:16px; margin-top:8px; }
  .stmt { background:#f6f8f7; border-left:4px solid var(--green); padding:10px 12px; margin:4px 0 12px; font-size:17px; }
  .padbox { position:relative; border:1.5px dashed #999; border-radius:6px; background:#fff; }
  canvas { display:block; width:100%; height:230px; touch-action:none; }
  .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#bbb; pointer-events:none; font-size:20px; }
  .row { display:flex; justify-content:flex-end; margin-top:6px; }
  button { font-size:18px; border:0; border-radius:6px; padding:12px 16px; cursor:pointer; font-family:inherit; }
  .clear { background:#eee; color:#333; padding:10px 18px; font-size:17px; }
  .send { width:100%; background:var(--green); color:#fff; font-weight:700; font-size:21px; padding:16px; }
  .send:disabled { background:#999; }
  .err { color:var(--red); margin-top:10px; min-height:1.2em; font-size:18px; }
  .done { text-align:center; padding:30px 16px; }
  .done .big { font-size:27px; font-weight:700; color:var(--green); margin-bottom:8px; }
  .done .no { font-size:25px; font-weight:700; margin:10px 0 4px; }
  .done .shot { background:#fff6e0; border-radius:6px; padding:8px; margin-top:12px; }
  .done img { max-width:100%; border:1px solid var(--line); border-radius:6px; margin-top:14px; }
  .again { background:#eee; color:#333; margin-top:16px; }
  .demo { background:#fff3cd; color:#7a5a00; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:17px; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  .chip { display:flex; align-items:center; gap:8px; border:2px solid var(--line); border-radius:28px; padding:9px 16px 9px 12px; cursor:pointer; }
  .chip input { width:24px; height:24px; margin:0; accent-color:var(--green); }
  .chip.on { border-color:var(--green); background:#e8f3ee; font-weight:600; }
  .locked .tag { display:inline-block; background:#e8f3ee; color:var(--green); font-size:15px; border-radius:4px; padding:1px 8px; margin-left:8px; font-weight:600; }
  .locked input { background:#f4f4f4; color:#333; -webkit-text-fill-color:#333; opacity:1; }
  .staff .link { word-break:break-all; background:#f4f4f4; border-radius:6px; padding:10px; margin:12px 0; font-size:15px; }
  .staff .send { margin-top:14px; }
  .line { background:#06c755; }
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demoBar" hidden>試玩版：可以照常填寫、簽名、送出，但不會存進資料庫</div>
  <div class="card staff" id="staffArea" hidden></div>
  <div id="formArea">
    <div class="card head">
      <h1 id="ftitle"></h1>
      <p id="fdesc"></p>
      <div class="req-note">* 表示必填問題</div>
    </div>
    <div id="qs"></div>
    <div class="card q" id="sigCard">
      <div class="qt">簽名人姓名<span class="star">*</span></div>
      <input type="text" id="signer" autocomplete="name">
      <div class="msg" hidden>請填簽名人姓名</div>
      <div class="stmt" id="stmt"></div>
      <div class="qt">廠商簽名<span class="star">*</span></div>
      <div class="padbox">
        <canvas id="pad"></canvas>
        <div class="hint" id="hint">請在此用手指簽名</div>
      </div>
      <div class="row"><button class="clear" id="clear" type="button">重簽</button></div>
      <div class="msg" id="sigMsg" hidden>請先簽名</div>
    </div>
    <button class="send" id="send" type="button">送出</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card done" id="doneCard" hidden>
    <div class="big">已送出，謝謝！</div>
    <div class="no" id="doneNo"></div>
    <div id="doneTime"></div>
    <div class="shot">請截圖這個畫面，傳給工程專員</div>
    <img id="doneSig" alt="簽名">
    <button class="again" type="button" onclick="location.href = location.pathname">再填下一家</button>
  </div>
</div>

<script>

    [].forEach.call(box.querySelectorAll('input,textarea'), function (x) {

      else if (x.value) v[x.name] = x.value;
    });
    draft.vals = v; draft.signer = signer.value; save(DRAFT, draft);
  }
  (function restore() {
    var v = draft.vals;
    [].forEach.call(box.querySelectorAll('input,textarea'), function (x) {
      if (!(x.name in v)) return;
      if (x.type === 'checkbox' || x.type === 'radio') x.checked = v[x.name].indexOf(x.value) >= 0;
      else x.value = v[x.name];
    });
    if (companyQ >= 0) { var cp = cards[companyQ].querySelector('input'); if (!cp.value && me.company) cp.value = me.company; }
    signer.value = draft.signer || me.signer || '';
  })();

  // ---- 專員預填連結：?s=店號(&n=新店店名)&a=開工&b=完工&p=評估人員&d=評估日期 → 這幾題帶好並鎖住
  var qs = new URLSearchParams(location.search), prefill = null;
  function qi(test) { for (var i = 0; i < FORM.questions.length; i++) if (test(FORM.questions[i])) return i; return -1; }
  function findStore(id) { if (STORES) for (var j = 0; j < STORES.stores.length; j++) if (STORES.stores[j][0] === id) return STORES.stores[j]; return null; }
  function lock(i) {
    var c = cards[i]; c.classList.add('locked'); c.classList.remove('bad');
    c.querySelector('.qt').appendChild(el('span', 'tag', '專員已填'));
    [].forEach.call(c.querySelectorAll('input'), function (x) { x.disabled = true; });
    [].forEach.call(c.querySelectorAll('.tip, .qd'), function (x) { x.hidden = true; });
    [].forEach.call(c.querySelectorAll('.opt'), function (o) { if (!o.querySelector('input').checked) o.hidden = true; });   // 單選只留選中的那個
  }
  if (qs.get('s') || qs.get('n')) {
    prefill = true;
    var st = findStore(qs.get('s') || ''), sq = qi(function (q) { return q.type === 'store'; });
    var rq = qi(function (q) { return q.type === 'range'; }), dq = qi(function (q) { return q.title.indexOf('評估日期') === 0; });
    cards[sq].querySelector('input').value = st ? st[0] + ' ' + st[1] : (qs.get('n') || qs.get('s'));
    lock(sq);
    if (st && areaQ >= 0) { var ar = cards[areaQ].querySelector('input[value="' + st[2] + '"]'); if (ar) { ar.checked = true; lock(areaQ); } }
    if (qs.get('a') && qs.get('b')) {   // 日期不合法或起訖顛倒就不鎖，讓廠商自己改
      var rr = cards[rq].querySelectorAll('input'); rr[0].value = qs.get('a'); rr[1].value = qs.get('b');
      if (rr[0].value && rr[1].value && rr[0].value <= rr[1].value) lock(rq); else { rr[0].value = rr[1].value = ''; }
    }
    if (qs.get('p') && assessorQ >= 0) { cards[assessorQ].querySelector('input').value = qs.get('p'); lock(assessorQ); }
    if (qs.get('d') && dq >= 0) { var di = cards[dq].querySelector('input'); di.value = qs.get('d'); if (di.value) lock(dq); }
  }
  applyJobs();

  // ---- 專員發單頁：?staff=1
  if (qs.get('staff')) {
    document.getElementById('formArea').hidden = true;
    var sa = document.getElementById('staffArea'), mine = load(STAFF) || {}, pickedStore = null;
    sa.hidden = false;
    sa.appendChild(el('div', 'qt', '專員發單'));
    sa.appendChild(el('div', 'tip', '先填工地、工期、評估人員，產生連結傳給廠商；廠商打開時這幾題已填好'));
    function row(label, node) { var w = el('div'); w.style.marginTop = '12px'; w.appendChild(el('div', 'qt', label)); w.appendChild(node); sa.appendChild(w); return node; }
    var sIn = document.createElement('input'); sIn.type = 'text'; sIn.autocomplete = 'off'; sIn.placeholder = '打店名或店號';
    var sWrap = el('div'), sList = el('div', 'sugg'); sList.hidden = true; sWrap.appendChild(sIn); sWrap.appendChild(sList);
    row('工地名稱', sWrap);
    if (STORES) storeSearch(sIn, sList, function (st2) { pickedStore = st2; });
    sIn.addEventListener('input', function () { pickedStore = null; });
    var rg = el('div', 'range'), ga = document.createElement('input'), gb = document.createElement('input');
    ga.type = gb.type = 'date';
    rg.appendChild(el('label', null, '開始日')); rg.appendChild(ga); rg.appendChild(el('label', null, '結束日')); rg.appendChild(gb);
    ga.addEventListener('change', function () { if (ga.value && (!gb.value || gb.value < ga.value)) gb.value = ga.value; gb.min = ga.value; });
    row('工期區間', rg);
    var pIn = document.createElement('input'); pIn.type = 'text'; pIn.value = mine.name || '';
    row('評估人員（你的名字）', pIn);
    var dIn = document.createElement('input'); dIn.type = 'date';
    var d0 = new Date(), z0 = function (n) { return ('0' + n).slice(-2); };
    dIn.value = d0.getFullYear() + '-' + z0(d0.getMonth() + 1) + '-' + z0(d0.getDate());
    row('評估日期', dIn);
    var gm = el('div', 'msg'); gm.hidden = true; sa.appendChild(gm);
    var gen = el('button', 'send', '產生連結'); gen.type = 'button'; sa.appendChild(gen);
    var out = el('div'); out.hidden = true; sa.appendChild(out);
    gen.onclick = function () {
      var name = sIn.value.trim();
      if (!name || !ga.value || !gb.value || !pIn.value.trim() || !dIn.value) { gm.textContent = '工地、工期、評估人員、評估日期都要填'; gm.hidden = false; return; }
      if (gb.value < ga.value) { gm.textContent = '結束日不能早於開始日'; gm.hidden = false; return; }
      gm.hidden = true; save(STAFF, { name: pIn.value.trim() });
      var u = new URLSearchParams();
      if (pickedStore) u.set('s', pickedStore[0]); else u.set('n', name);
      u.set('a', ga.value); u.set('b', gb.value); u.set('p', pIn.value.trim());
      u.set('d', dIn.value);
      var link = location.origin + location.pathname + '?' + u.toString();
      var msg = '【工地事前風險評估暨危害告知】' + (pickedStore ? pickedStore[1] + '門市' : name) + '，請施工前填寫並簽名：\n' + link;
      out.innerHTML = ''; out.hidden = false;
      out.appendChild(el('div', 'link', link));
      var cp = el('button', 'send', '複製連結'); cp.type = 'button';
      cp.onclick = function () {
        (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(function () { cp.textContent = '已複製，去 LINE 貼上'; },
          function () { window.prompt('請長按複製', msg); });
      };
      var ln = el('button', 'send line', '用 LINE 傳給廠商'); ln.type = 'button';
      ln.onclick = function () { location.href = 'https://line.me/R/share?text=' + encodeURIComponent(msg); };
      out.appendChild(cp); out.appendChild(ln);
      var tr = el('button', 'again', '我先看看廠商會看到什麼'); tr.type = 'button'; tr.onclick = function () { window.open(link, '_blank'); };
      out.appendChild(tr);
    };
  }

  // 聲明句帶入評估人員
  var stmt = document.getElementById('stmt');
  function updStmt() {
    var n = assessorQ >= 0 ? cards[assessorQ].querySelector('input').value.trim() : '';
    stmt.textContent = '本人已由統一超商評估人員 ' + (n || '○○○') + ' 告知上述危害因素及應採取之措施。';
  }
  if (assessorQ >= 0) cards[assessorQ].querySelector('input').addEventListener('input', updStmt);
  updStmt();

  // ---- 簽名板
  var pad = document.getElementById('pad'), hint = document.getElementById('hint'), sigCard = document.getElementById('sigCard');
  var sigMsg = document.getElementById('sigMsg');
  signer.addEventListener('input', function () { signer.nextElementSibling.hidden = true; if (dirty) sigCard.classList.remove('bad'); keep(); });
  var ctx = pad.getContext('2d'), drawing = false, dirty = false, last = null, cssW = 1, cssH = 1;
  function resize() {
    // 依實際顯示大小×螢幕倍率設畫布，線才不會糊；重設會清空，所以只在還沒簽時調整
    if (dirty) return;
    var r = pad.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    pad.width = Math.round(r.width * k); pad.height = Math.round(r.height * k); cssW = r.width; cssH = r.height;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
  }
  // 簽到一半轉手機，畫布不重設（會清掉簽名），座標換算回原尺寸
  function pos(e) { var r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * cssW / r.width, y: (e.clientY - r.top) * cssH / r.height }; }
  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    drawing = true; last = pos(e);
    ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
    dirty = true; hint.hidden = true; sigMsg.hidden = true; if (signer.value.trim()) sigCard.classList.remove('bad');
  });
  pad.addEventListener('pointermove', function (e) {
    if (!drawing) return; e.preventDefault();
    var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { pad.addEventListener(t, function () { drawing = false; }); });
  document.getElementById('clear').onclick = function () {
    dirty = false; resize(); ctx.clearRect(0, 0, pad.width, pad.height); hint.hidden = false;
  };
  window.addEventListener('resize', resize);
  resize();
  function sigPng() {
    // 疊白底再輸出，免得透明底在別的軟體看起來一片黑
    var c = document.createElement('canvas'); c.width = pad.width; c.height = pad.height;
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(pad, 0, 0);
    return c.toDataURL('image/png');
  }

  // ---- 送出
  var send = document.getElementById('send'), err = document.getElementById('err');
  send.onclick = function () {
    err.textContent = '';
    var answers = [], first = null, missing = 0;
    if (jobCard) { var nj = !jobsPicked().length; mark(jobCard, nj); if (nj) missing++; }
    FORM.questions.forEach(function (q, i) {
      var v = answer(i); answers.push(v);
      if (q.type === 'note' || jobHidden(i)) return;
      var bad = q.required && (Array.isArray(v) ? v.length === 0 : !v);
      mark(cards[i], bad); if (bad) missing++;
    });
    var noName = !signer.value.trim();
    sigCard.classList.toggle('bad', noName || !dirty);
    signer.nextElementSibling.hidden = !noName; sigMsg.hidden = dirty;
    missing += (noName ? 1 : 0) + (dirty ? 0 : 1);
    first = [].filter.call(document.querySelectorAll('#formArea .bad'), function (c) { return !c.hidden; })[0] || null;
    if (first) {
      err.textContent = '還有 ' + missing + ' 題沒填（紅框處）';
      first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return;
    }
    var sig = sigPng(), data = { answers: answers, sig: sig, signer: signer.value.trim(), sid: draft.sid, jobs: jobsPicked(), staff: !!prefill };
    send.disabled = true; send.textContent = '送出中…';
    function ok(r) {
      try { localStorage.removeItem(DRAFT); } catch (e) {}
      save(ME, { company: companyQ >= 0 ? answers[companyQ] : '', signer: data.signer });
      document.getElementById('formArea').hidden = true;
      document.getElementById('doneCard').hidden = false;
      document.getElementById('doneNo').textContent = '簽單編號：' + r.no;
      document.getElementById('doneTime').textContent = '送出時間：' + r.time;
      document.getElementById('doneSig').src = sig;
      window.scrollTo(0, 0);
    }
    function fail(e) {
      send.disabled = false; send.textContent = '送出';
      err.textContent = '送出失敗：' + (e && e.message ? e.message : e);
    }
    if (DEMO) {
      var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };
      setTimeout(function () { ok({ no: '試玩-001', time: d.getFullYear() + '/' + z(d.getMonth() + 1) + '/' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) }); }, 600);
    } else if (window.google && google.script) {
      // 從 script.google.com 直接開
      google.script.run.withSuccessHandler(ok).withFailureHandler(fail).submitForm(data);
    } else {
      // GitHub Pages：text/plain 不觸發 CORS 預檢；不帶 cookie，Google 帳號不會插手
      fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(data), credentials: 'omit', redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
        .then(function (res) { return res.json(); })
        .then(function (r) { if (r.ok) ok(r); else fail(r.error); })
        .catch(function () { fail('網路不穩，請再按一次送出（不會重複送）'); });
    }
  };
})();
</script>
</body>
</html>
